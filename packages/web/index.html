<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- No `viewport-fit=cover` on the meta above (deliberately, see git log)
         - it let content render under the status bar/Dynamic Island/home
         indicator, but WKWebView's own accounting of the "safe" viewport
         under that "cover" mode is what caused a confirmed-on-device bug
         where window.innerHeight comes up short of the real screen after a
         cold launch of the installed PWA, permanently losing a strip at the
         true bottom edge with no in-page fix able to reach it. Without
         `cover`, iOS confines the whole page to the safe area itself (no
         env(safe-area-inset-*) values needed, they resolve to 0), which
         trades away the edge-to-edge cover-image effect under the island for
         a correctly-reported viewport on every page. -->
    <!-- "default" (not "black-translucent") now that viewport-fit=cover is
         gone above - black-translucent means the status bar is transparent
         with page content showing through behind it, which needs cover mode
         to have anything back there to show; without it iOS just paints an
         opaque bar itself. "default" lets that bar's background follow the
         theme-color meta above (kept in sync with light/dark theme by the
         inline script below and ThemeContext.tsx), instead of a fixed color
         that doesn't track the theme. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Notorious</title>
    <script>
      // Applies the persisted/system theme (and its matching theme-color)
      // synchronously, before the first paint - ThemeContext.tsx does the
      // same thing on mount, but only inside a React effect that runs after
      // hydration, which left a brief flash of the wrong theme (and wrong
      // Dynamic Island color) on every load. Keep the two color values below
      // in sync with THEME_COLORS in src/lib/themeColors.ts by hand - this
      // script runs before any bundled module, so it can't import from it.
      (function () {
        var stored = localStorage.getItem("notorious-theme");
        var theme = stored === "light" || stored === "dark" ? stored : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.classList.toggle("dark", theme === "dark");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#0f111a" : "#ffffff");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Blocks phone-landscape use (see .orientation-lock-overlay in
         globals.css); sits outside #root so it survives regardless of app
         render state. -->
    <div id="orientation-lock-overlay" class="orientation-lock-overlay">
      <p>Notorious is only available in portrait mode.<br />Please rotate your device.</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
